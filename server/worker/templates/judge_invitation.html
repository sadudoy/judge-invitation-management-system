<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>CSE Fest Judge Invitation</title></head>
<body style="font-family: sans-serif; line-height: 1.5; color: #222;">
  <h2>Judge Invitation — CSE Fest</h2>
  <p>Dear <strong>{{judge_name}}</strong>,</p>
  <p>You have been formally invited to serve as an evaluator for <strong>{{competition_name}}</strong> at CSE Fest.</p>
  <p style="margin: 24px 0;">
    <a href="{{magic_link_url}}" style="background: #2563eb; color: #fff; padding: 10px 20px; text-decoration: none; border-radius: 4px; font-weight: bold;">

  <p>Or paste this link into your browser:<br><code>{{magic_link_url}}</code></p>

</body>
</html>
